name: Sync to sub-repos

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to sub-repos
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "lambnote"
          git config user.email "lambnote@users.noreply.github.com"

          # ═══ 在这里加子仓库，每行一个 ═══
          REPOS=(
            # "cx-slot-2"
            # "cx-slot-3"
            # "cx-slot-4"
            # "cx-slot-5"
            # "cx-slot-6"
            # "cx-slot-7"
            # "cx-slot-8"
            # "cx-slot-9"
            # "cx-slot-10"
          )

          for REPO in "${REPOS[@]}"; do
            echo ">>> Syncing to $REPO"
            git remote add "$REPO" "https://x-access-token:${TOKEN}@github.com/lambnote/${REPO}.git" 2>/dev/null || true
            git push "$REPO" main --force
          done
